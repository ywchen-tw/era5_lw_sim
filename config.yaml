# Arctic inversion pipeline — user-editable defaults.
# CLI arguments override these where applicable.

# Default reanalysis data source: era5 | merra2 | carra2 (override: --source).
source: era5

# Download / analysis domain as [North, West, South, East] (degrees).
# Per-source override: an `area` key inside a source's own block (CARRA-2
# sets one, see below).
area: [90, -180, 80, 180]

paths:
  data: data          # raw downloads    -> data/<source>/YYYY/MM/DD/
  derived: derived    # metric netCDFs   -> derived/<source>/YYYY/MM/DD/
  figures: figures    # figures          -> figures/<source>/

# ERA5 (Copernicus CDS) download settings — src/era5_download.py.
download:
  default_hours: [0, 6, 12, 18]
  plev_variables:
    - fraction_of_cloud_cover
    - ozone_mass_mixing_ratio
    - relative_humidity
    - specific_cloud_ice_water_content
    - specific_cloud_liquid_water_content
    - specific_humidity
    - temperature
  sfc_variables:
    - 2m_temperature
    - skin_temperature
    - surface_pressure
    # surface fluxes (for future analyses; unused by the inversion metrics).
    # Accumulated over the hour ending at valid_time, units J m-2 (divide by
    # 3600 for W m-2); ERA5 sign convention: positive downward.
    - surface_sensible_heat_flux
    - surface_latent_heat_flux
    - surface_net_solar_radiation
    - surface_net_thermal_radiation
    - surface_solar_radiation_downwards
    - surface_thermal_radiation_downwards
    # classification fields for the stratified analysis: surface type from
    # land_sea_mask + sea_ice_cover, sky state from total_cloud_cover
    - land_sea_mask
    - sea_ice_cover
    - total_cloud_cover
  pressure_levels: [1, 2, 3, 5, 7, 10, 20, 30, 50, 70, 100, 125, 150, 175,
                    200, 225, 250, 300, 350, 400, 450, 500, 550, 600, 650,
                    700, 750, 775, 800, 825, 850, 875, 900, 925, 950, 975, 1000]

# MERRA-2 (NASA GES DISC) download settings — src/merra2_download.py.
# Downloaded files are normalized on write to the same variable/coordinate
# names as ERA5 (t, q, o3, clwc, ciwc / t2m, skt, sp), so all analysis stages
# read either source unchanged.
merra2:
  collections:
    plev: M2I3NPASM   # inst3_3d_asm_Np: 3-hourly INSTANTANEOUS, 42 pressure levels
    sfc: M2I1NXASM    # inst1_2d_asm_Nx: hourly INSTANTANEOUS single-level
    rad: M2T1NXRAD    # tavg1_2d_rad_Nx: 1-h time-averaged W/m2, stamped HH:30
    ocn: M2T1NXOCN    # tavg1_2d_ocn_Nx: 1-h time-averaged, stamped HH:30
    const: M2C0NXASM  # const_2d_asm_Nx: time-invariant, ONE file total
  version: "5.12.4"
  plev_variables: [T, QV, O3, QL, QI]   # -> t, q, o3, clwc, ciwc
  sfc_variables: [T2M, TS, PS]          # -> t2m, skt, sp
  # Surface radiation for stage 7 (LWdn = LWGAB/EMIS; LWup = LWGEM + refl.)
  rad_variables: [LWGAB, LWGEM, LWGABCLR, EMIS, CLDTOT]
  # Classification fields for the stratified analysis: sea-ice fraction
  # (-> siconc) and static land/ocean fractions (-> frland/frlandice/frocean)
  ocn_variables: [FRSEAICE]
  const_variables: [FRLAND, FRLANDICE, FROCEAN]
  # Hours must be multiples of 3 (the M2I3NPASM cadence).
  default_hours: [0, 6, 12, 18]

# CARRA-2 (Copernicus pan-Arctic Regional Reanalysis) — src/carra2_download.py.
# HARMONIE-AROME at 2.5 km on a north polar-stereographic grid, so unlike the
# global sources these files keep projected y/x dims with 2-D latitude and
# longitude; the analysis stages handle both layouts via reanlib/grid.py.
carra2:
  # the SUB-DAILY entry: reanalysis-pan-carra-means holds only daily/monthly
  # aggregates, which cannot feed the inversion metrics
  dataset: reanalysis-pan-carra
  # WIDENED to the full 80-90N cap (matching ERA5/MERRA-2) for the stratified
  # clear/cloudy x surface-type analysis: 85-90N is all pack ice, so land /
  # open-water / marginal-ice categories only exist south of it (N Greenland
  # 83.7N, Ellesmere 83.1N, Franz Josef Land 81.9N, Severnaya Zemlya 81.3N,
  # Svalbard 80.8N, Fram Strait / Barents open water). Cells scale as
  # tan^2((90-lat)/2): 80-90N is 4x the cells of the original 85-90N domain
  # (~796 k vs 199 k per field). CDS request COST does not scale with area
  # (measured: plev 960/day either way), only transfer volume and disk do.
  # The January 2020 85-90N results remain reproducible from 80-90N files via
  # `monthly_stats.py --area 90 -180 85 180`.
  area: [90, -180, 80, 180]
  # CARRA-2 has no specific humidity on pressure levels (q is derived from
  # relative_humidity) and no ozone at all, which is why stage 7 does not
  # accept --source carra2.
  # Trimmed to exactly what stages 1-6 read. The three cloud fields cost 2.5x
  # the download (318 -> 127 MB/day at 85-90N) and no stage 1-6 opens them;
  # land_sea_mask is unread too, and there is no land above 85N. Add them back
  # here if radiative-transfer work ever needs them -- normalization treats
  # them as optional either way.
  plev_variables:
    - temperature
    - relative_humidity
  sfc_variables:
    - 2m_temperature
    - skin_temperature
    - surface_pressure
    # classification fields for the stratified analysis: surface type from
    # land_sea_mask + sea_ice_area_fraction, sky state from total_cloud_cover
    # (all three names validated against the CDS costing endpoint)
    - land_sea_mask
    - sea_ice_area_fraction
    - total_cloud_cover
  # All 20 CARRA-2 pressure levels. The top is 50 hPa, not ERA5's 1 hPa.
  pressure_levels: [50, 70, 100, 150, 200, 250, 300, 400, 500, 600, 700,
                    750, 800, 825, 850, 875, 900, 925, 950, 1000]
  # Analyses run 3-hourly (00, 03, ... 21 UTC); other hours are forecast only.
  default_hours: [0, 6, 12, 18]
  # Days bundled into ONE CDS request, per level type (--chunk-days overrides
  # both). The archive queues per request, not per byte -- with 65 concurrent
  # slots and a backlog observed in the thousands, the NUMBER of requests is
  # what sets wall-clock. This makes January 4 queue positions instead of 62.
  # The ceiling is the CDS cost limit of 12000: with the variables, levels and
  # area above, a profile day costs 960 and a surface day 72, so plev tops out
  # at 12 days per request (12*960 = 11520) and sfc fits a whole month.
  # Adding variables or levels raises the cost proportionally; an over-large
  # request is rejected immediately at submission, not after queueing.
  chunk_days:
    plev: 12
    sfc: 31
  # Saturation reference for the RH -> q conversion: water | ice | mixed.
  # CARRA documents its relative humidity against saturation over water.
  rh_over: water

# Surface-based inversion (SBI) scan parameters.
sbi:
  top_limit_hpa: 500        # do not scan for the inversion top above this level
  max_embedded_levels: 1    # tolerated consecutive non-increasing levels inside an inversion
  # sbi_found requires T_top - T_base >= this (K). 0.5 K follows the criterion
  # used with the Kahl/Serreze algorithm at Arctic radiosonde stations
  # (doi:10.1175/JAMC-D-21-0054.1); a 0.3 K variant appears in the Ny-Alesund
  # high-resolution radiosonde climatology (Atmos. Res. 2021). No established
  # Arctic SBI study uses 1 K.
  min_strength_k: 0.5

masking:
  # NaN the fixed-level metrics where their lower level is below ground
  # (dt_850_2m where sp < 850 hPa; dt_925_1000 where sp < 1000 hPa).
  mask_fixed_below_ground: true
